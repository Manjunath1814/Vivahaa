<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <meta name="theme-color" content="#050505">

    <meta name="description"
          content="Vivaha - Premium AI Powered Matrimony Platform">

    <meta name="robots"
          content="index,follow">

    <title>Vivaha</title>

    <!-- Favicon -->

    <link rel="icon"
          type="image/png"
          href="assets/logo.jpg">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- ==========================
         Splash Screen
    =========================== -->

    <main
        class="splash-container">

        <!-- Background Effects -->

        <div class="bg-light bg-light-1"></div>

        <div class="bg-light bg-light-2"></div>

        <!-- Logo -->

        <div class="logo-wrapper">

            <img
                src="assets/logo.jpg"
                alt="Vivaha Logo"
                class="logo">

        </div>

        <!-- Brand -->

        <h1 class="brand-name">

            VIVAHA

        </h1>

        <!-- Tagline -->

        <p class="tagline">

            Where Hearts Find Home

        </p>

        <!-- Loader -->

        <div class="loader-wrapper">

            <div class="loader-track">

                <div class="loader-progress"></div>

            </div>

        </div>

        <!-- Loading Text -->

        <p
            id="loadingText"
            class="loading-text">

            Building Meaningful Connections...

        </p>

    </main>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
