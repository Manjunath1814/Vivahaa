<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <meta name="theme-color" content="#050505">

    <meta name="description"
          content="Vivaha - Premium AI Powered Matrimony">

    <meta name="robots"
          content="index,follow">

    <title>Login | Vivaha</title>

    <link rel="icon"
          href="../assets/logo.jpg">

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

    <!-- ===========================
         Background
    ============================ -->

    <div class="background">

        <div class="blur blur-1"></div>

        <div class="blur blur-2"></div>

    </div>


    <!-- ===========================
         Login Card
    ============================ -->

    <main class="login-container">

        <section class="login-card">

            <!-- Brand Logo -->

            <img src="../assets/brand-logo.png"
                 alt="Vivaha"
                 class="brand-logo">

            <!-- Heading -->

            <h1>

                Welcome Back

            </h1>

            <p class="subtitle">

                Continue your journey to find your perfect life partner.

            </p>


            <!-- ======================
                 Google Login
            ======================= -->

            <button id="googleLogin"
                    class="google-btn"
                    type="button">

                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google">

                <span>

                    Continue with Google

                </span>

            </button>


            <!-- Divider -->

            <div class="divider">

                <span>OR</span>

            </div>


            <!-- ======================
                 Phone Login
            ======================= -->

            <form id="phoneForm"
                  autocomplete="off">

                <div class="phone-input">

                    <span class="phone-icon">

                        📞

                    </span>

                    <span class="country-code">

                        +91

                    </span>

                    <input

                        id="phone"

                        type="tel"

                        maxlength="10"

                        inputmode="numeric"

                        placeholder="Enter Mobile Number"

                        required>

                </div>

                <button

                    id="sendOtp"

                    class="continue-btn"

                    type="submit">

                    Continue

                </button>

            </form>


            <!-- ======================
                 OTP
            ======================= -->

            <section

                id="otpSection"

                class="otp-section">

                <h2>

                    Enter Verification Code

                </h2>

                <p>

                    We've sent a 6 digit OTP to your mobile number.

                </p>

                <div class="otp-boxes">

                    <input maxlength="1" inputmode="numeric">

                    <input maxlength="1" inputmode="numeric">

                    <input maxlength="1" inputmode="numeric">

                    <input maxlength="1" inputmode="numeric">

                    <input maxlength="1" inputmode="numeric">

                    <input maxlength="1" inputmode="numeric">

                </div>

                <button

                    id="verifyOtp"

                    class="verify-btn"

                    type="button">

                    Verify OTP

                </button>

                <button

                    id="resendOtp"

                    class="resend-btn"

                    type="button">

                    Resend OTP

                </button>

            </section>

        </section>

    </main>


    <!-- ===========================
         Full Screen Loader
    ============================ -->

    <div

        id="loader"

        class="loader">

        <div class="spinner"></div>

        <p>

            Please wait...

        </p>

    </div>


    <!-- Invisible reCAPTCHA -->

    <div id="recaptcha-container"></div>


    <!-- ===========================
         JavaScript
    ============================ -->

    <script type="module"
            src="login.js"></script>

</body>

          </html>
