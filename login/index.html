<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#050505">

    <meta
        name="description"
        content="Vivahaa - AI Powered Matrimony">

    <title>Login | Vivahaa</title>

    <link
        rel="icon"
        href="../assets/logo.jpg">

    <link
        rel="stylesheet"
        href="login.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="blur blur-one"></div>

        <div class="blur blur-two"></div>

    </div>

    <!-- Login -->

    <main class="login-container">

        <section class="login-card">

            <img
                src="../assets/brand-logo.png"
                alt="Vivahaa Logo"
                class="brand-logo">

            <h1>

                Welcome to Vivahaa

            </h1>

            <p class="subtitle">

                India's Premium AI Powered Matrimony Platform

            </p>

            <button
                id="googleLogin"
                class="google-button"
                type="button">

                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google">

                <span>

                    Continue with Google

                </span>

            </button>

            <p class="terms">

                By continuing, you agree to our
                <a href="#">Terms of Service</a>
                &
                <a href="#">Privacy Policy</a>

            </p>

        </section>

    </main>

    <!-- Full Screen Loader -->

    <div
        id="loader"
        class="loader hidden">

        <div class="spinner"></div>

        <p>

            Signing you in...

        </p>

    </div>

    <script
        type="module"
        src="login.js"></script>

</body>

</html>
